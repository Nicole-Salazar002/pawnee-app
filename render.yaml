services:
  - type: web
    name: pawnee
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: MONGODB_DB
        value: pawnee_mongoose
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: MONGODB_URI
        sync: false
