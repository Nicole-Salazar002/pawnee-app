services:
  - type: web
    name: pawnee
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --ignore-scripts --prefix api && npm run build --prefix api && npm install --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix api
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: MONGODB_DB
        value: pawnee_mongoose
      - key: FRONTEND_DIST
        value: ../frontend/dist
      - key: MONGODB_URI
        sync: false
