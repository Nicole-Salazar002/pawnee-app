services:
  - type: web
    name: pawnee-app
    runtime: node
    plan: free
    # Sin rootDir. En el dashboard el campo Root Directory tiene que quedar
    # vacio. Si pones "." o "api", npm no encuentra package.json y el build
    # termina con estado 254.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: MONGODB_DB
        value: pawnee_mongoose
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: MONGODB_URI
        sync: false
